<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明's Life - 생활계획표</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>明's Life - 생활계획표</h1>
  <p>홈 화면에 추가해서 앱처럼 사용하세요.</p>

  <button onclick="alert('앱이 정상 작동 중입니다!')">테스트 버튼</button>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker 등록 완료'))
        .catch(err => console.log('SW 오류:', err));
    }
  </script>
</body>
</html>
