<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明's Life</title>
<link rel="manifest" href="manifest.json">
<style>
body { margin:0; font-family:sans-serif; text-align:center; }
.screen { display:none; padding:20px; }
.active { display:block; }

.keypad button {
  width:70px; height:70px; margin:5px;
  font-size:24px; border-radius:50%;
}

.tabs button { margin:5px; padding:10px; }

.todo { text-align:left; margin:10px; }

.circle {
  width:120px; height:120px; border-radius:50%;
  border:10px solid lightgray;
  position:relative; margin:auto;
}
.fill {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  border-radius:50%;
  clip:rect(0,120px,120px,60px);
}
</style>
</head>
<body>

<!-- 비밀번호 -->
<div id="lock" class="screen active">
<h2>🔒 비밀번호</h2>
<div id="dots"></div>
<div class="keypad" id="keys"></div>
<button onclick="del()">지우기</button>
</div>

<!-- 메인 -->
<div id="main" class="screen">
<h2>📅 明's Life</h2>
<div id="date"></div>

<div class="tabs">
<button onclick="setTab('today')">오늘</button>
<button onclick="setTab('week')">주간</button>
<button onclick="setTab('month')">월간</button>
<button onclick="setTab('year')">년간</button>
</div>

<div id="list"></div>

<h3>🎯 달성률</h3>
<div id="percent">0%</div>

<button onclick="add()">➕</button>
</div>

<script>
let pass = localStorage.getItem("pass") || "";
let input = "";

function renderDots(){
  document.getElementById("dots").innerHTML =
    "●".repeat(input.length);
}

function makeKeys(){
  let k="";
  for(let i=1;i<=9;i++){
    k+=`<button onclick="press(${i})">${i}</button>`;
  }
  k+=`<button onclick="press(0)">0</button>`;
  document.getElementById("keys").innerHTML=k;
}
makeKeys();

function press(n){
  input+=n;
  renderDots();
  if(input.length===6){
    if(!pass){
      localStorage.setItem("pass", input);
      pass=input;
      enter();
    }else{
      if(input===pass) enter();
      else { alert("틀림"); input=""; renderDots(); }
    }
  }
}

function del(){
  input=input.slice(0,-1);
  renderDots();
}

function enter(){
  document.getElementById("lock").classList.remove("active");
  document.getElementById("main").classList.add("active");
  load();
}

let tab="today";

function setTab(t){
  tab=t;
  load();
}

function load(){
  let data = JSON.parse(localStorage.getItem(tab)||"[]");
  let html="";
  let done=0;

  data.forEach((d,i)=>{
    if(d.done) done++;
    html+=`
    <div class="todo">
      <input type="checkbox" ${d.done?"checked":""}
      onclick="toggle(${i})">
      ${d.text}
    </div>`;
  });

  document.getElementById("list").innerHTML=html;

  let p = data.length ? Math.round(done/data.length*100) : 0;
  document.getElementById("percent").innerText=p+"%";
}

function add(){
  let t = prompt("계획 입력");
  if(!t) return;
  let data = JSON.parse(localStorage.getItem(tab)||"[]");
  data.push({text:t,done:false});
  localStorage.setItem(tab, JSON.stringify(data));
  load();
}

function toggle(i){
  let data = JSON.parse(localStorage.getItem(tab));
  data[i].done=!data[i].done;
  localStorage.setItem(tab, JSON.stringify(data));
  load();
}

document.getElementById("date").innerText =
  new Date().toLocaleDateString();
</script>

</body>
</html>
