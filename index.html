<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>明 Life - 생활계획표</title>
<style>
  :root { --main-p: #6C63E0; --bg: #F8F6FF; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Noto Sans KR', sans-serif; }
  body, html { margin: 0; padding: 0; height: 100%; background: #1a1040; overflow: hidden; }
  
  #app { max-width: 430px; height: 100%; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; position: relative; }

  /* 잠금 화면 */
  #lock-screen { position: absolute; inset: 0; background: var(--main-p); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
  #lock-screen input { width: 180px; padding: 15px; border-radius: 12px; border: none; text-align: center; font-size: 20px; margin: 20px 0; letter-spacing: 5px; }
  #lock-screen button { padding: 12px 40px; border-radius: 10px; border: none; background: white; color: var(--main-p); font-weight: bold; }

  /* 상단 헤더 */
  .header { background: var(--main-p); padding: env(safe-area-inset-top, 20px) 20px 15px; color: white; flex-shrink: 0; }
  .header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 5px; }
  .header .ming { color: #FF5252; font-weight: 800; }
  
  /* 탭 메뉴 */
  .tabs { display: flex; background: rgba(255,255,255,0.15); border-radius: 25px; margin-top: 15px; padding: 3px; }
  .tab { flex: 1; padding: 8px; text-align: center; color: rgba(255,255,255,0.7); font-size: 13px; border-radius: 20px; cursor: pointer; }
  .tab.active { background: white; color: var(--main-p); font-weight: bold; }

  /* 메인 컨텐츠 영역 */
  .content { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
  .view { display: none; }
  .view.active { display: block; }

  /* 리스트 카드 스타일 */
  .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; }
  .card-info h3 { margin: 0; font-size: 15px; color: #333; }
  .card-info p { margin: 3px 0 0; font-size: 12px; color: #888; }
  
  /* 추가 버튼 */
  .add-btn { position: fixed; right: 20px; bottom: 100px; width: 56px; height: 56px; background: var(--main-p); border-radius: 50%; color: white; font-size: 30px; border: none; box-shadow: 0 4px 12px rgba(108,99,224,0.4); z-index: 100; display: flex; align-items: center; justify-content: center; }

  /* 설정 메뉴 */
  .setting-row { background: white; padding: 18px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .setting-row.danger { color: #FF5252; font-weight: bold; }

  /* 하단 네비게이션 */
  .nav { height: calc(65px + env(safe-area-inset-bottom)); background: white; border-top: 1px solid #EEE; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #AAA; font-size: 10px; cursor: pointer; flex: 1; }
  .nav-item.active { color: var(--main-p); }
  .nav-item i { font-size: 22px; font-style: normal; }

  /* 모달 */
  .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: none; align-items: flex-end; }
  .modal-overlay.active { display: flex; }
  .modal { background: white; width: 100%; border-radius: 25px 25px 0 0; padding: 25px; transform: translateY(100%); transition: transform 0.3s; }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal h2 { font-size: 18px; margin-bottom: 20px; text-align: center; }
  .modal input, .modal select { width: 100%; padding: 12px; border: 1px solid #DDD; border-radius: 10px; margin-bottom: 15px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; }
  .btn-save { background: var(--main-p); color: white; }
</style>
</head>
<body>

<div id="app">
  <div id="lock-screen">
    <h2 id="lock-msg">비밀번호를 입력하세요</h2>
    <input type="password" id="pw-input" inputmode="numeric" pattern="[0-9]*" placeholder="****">
    <button onclick="checkPassword()">확인</button>
  </div>

  <header class="header" id="main-header">
    <h1><span class="ming">明</span> Life 생활계획표</h1>
    <div class="tabs">
      <div class="tab active" onclick="changeTab('today', this)">오늘</div>
      <div class="tab" onclick="changeTab('weekly', this)">주간</div>
      <div class="tab" onclick="changeTab('monthly', this)">월간</div>
      <div class="tab" onclick="changeTab('yearly', this)">년간</div>
    </div>
  </header>

  <main class="content">
    <div id="view-planner" class="view active">
      <div id="plan-list">
        <p style="text-align:center; color:#AAA; margin-top:50px;">등록된 계획이 없습니다.<br>+ 버튼을 눌러 추가해보세요!</p>
      </div>
    </div>

    <div id="view-todo" class="view">
      <h2>체크리스트</h2>
      <div id="todo-list"></div>
    </div>

    <div id="view-settings" class="view">
      <div class="setting-row" onclick="openModal('일정 알림 설정')"><span>일정 알림 설정</span><span>〉</span></div>
      <div class="setting-row" onclick="openModal('목표 달성 알림')"><span>목표 달성 알림 설정</span><span>〉</span></div>
      <div class="setting-row" onclick="exportData()"><span>데이터 백업 (TXT 저장)</span><span>💾</span></div>
      <div class="setting-row danger" onclick="resetData()"><span>데이터 초기화</span><span>⚠</span></div>
    </div>
  </main>

  <button class="add-btn" id="global-add-btn" onclick="openAddModal()">+</button>

  <nav class="nav">
    <div class="nav-item active" onclick="showView('planner', this)"><i>📅</i><span>계획표</span></div>
    <div class="nav-item" onclick="showView('todo', this)"><i>✅</i><span>할 일</span></div>
    <div class="nav-item" onclick="showView('settings', this)"><i>⚙️</i><span>설정</span></div>
  </nav>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h2 id="modal-title">계획 추가</h2>
      <div id="modal-content">
        <input type="text" id="input-title" placeholder="제목을 입력하세요">
        <input type="time" id="input-time">
      </div>
      <div class="modal-btns">
        <button style="background:#EEE" onclick="closeModal()">취소</button>
        <button class="btn-save" onclick="saveData()">저장</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentTab = 'today';
  let currentView = 'planner';
  let savedPw = localStorage.getItem('app_password');

  // [기능 1] 비밀번호 체크
  if (savedPw) {
    document.getElementById('lock-screen').style.display = 'flex';
  } else {
    document.getElementById('lock-msg').textContent = "초기 비밀번호 설정";
    document.getElementById('lock-screen').style.display = 'flex';
  }

  function checkPassword() {
    const input = document.getElementById('pw-input').value;
    if (!savedPw) {
      localStorage.setItem('app_password', input);
      alert("비밀번호가 설정되었습니다.");
      location.reload();
    } else if (input === savedPw) {
      document.getElementById('lock-screen').style.display = 'none';
    } else {
      alert("비밀번호가 일치하지 않습니다.");
    }
  }

  // [기능 2] 뷰 전환 (계획표/할일/설정)
  function showView(viewId, el) {
    currentView = viewId;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');

    // 헤더 노출 여부
    document.getElementById('main-header').style.display = (viewId === 'planner') ? 'block' : 'none';
    // 추가 버튼 노출 여부
    document.getElementById('global-add-btn').style.display = (viewId === 'settings') ? 'none' : 'flex';
    
    history.pushState({view: viewId}, '');
  }

  // [기능 3] 탭 전환 (오늘/주간/월간/년간)
  function changeTab(tabId, el) {
    currentTab = tabId;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderPlans();
  }

  // [기능 4] 모달 제어
  function openAddModal() {
    document.getElementById('modal-title').textContent = currentTab.toUpperCase() + " 계획 추가";
    document.getElementById('modal-overlay').classList.add('active');
    history.pushState({modal: 'open'}, '');
  }

  function openModal(title) { // 설정용 알림 모달
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-content').innerHTML = `<p>해당 알림 기능을 활성화하시겠습니까?</p><select><option>사용함</option><option>사용안함</option></select>`;
    document.getElementById('modal-overlay').classList.add('active');
  }

  function closeModal(e) {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  // [기능 5] 안드로이드 뒤로가기 버튼 대응
  window.onpopstate = function(event) {
    if (document.getElementById('modal-overlay').classList.contains('active')) {
      document.getElementById('modal-overlay').classList.remove('active');
    } else if (currentView !== 'planner') {
      showView('planner', document.querySelector('.nav-item'));
    }
  };

  // [기능 6] 데이터 백업 및 초기화
  function exportData() {
    const data = JSON.stringify(localStorage);
    const blob = new Blob([data], {type: "text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "MingLife_Backup.txt";
    a.click();
  }

  function resetData() {
    if(confirm("정말 모든 데이터를 초기화하시겠습니까?")) {
      localStorage.clear();
      location.reload();
    }
  }

  function saveData() {
    alert("저장 기능이 성공적으로 호출되었습니다! (데이터 처리 로직 연결 가능)");
    closeModal();
  }

  // 초기 렌더링
  function renderPlans() {
    const list = document.getElementById('plan-list');
    // 실제 데이터 로드 로직이 들어가는 곳입니다.
  }
</script>

</body>
</html>
