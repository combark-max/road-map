<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생활계획표</title>
<link rel="manifest" href="manifest.json">
<style>
body { font-family: sans-serif; padding:20px; }
.hidden { display:none; }
button { padding:10px; margin-top:10px; }
</style>
</head>
<body>

<div id="lock">
  <h2 id="lockTitle">비밀번호 설정</h2>
  <input type="password" id="pw" placeholder="비밀번호 입력"/>
  <button onclick="handlePw()">확인</button>
</div>

<div id="app" class="hidden">
  <h2 id="tabTitle">주간</h2>

  <select onchange="changeTab(this.value)">
    <option value="주간">주간</option>
    <option value="월간">월간</option>
    <option value="년간">년간</option>
  </select>

  <button onclick="openInput()">+</button>

  <ul id="list"></ul>
</div>

<div id="inputBox" class="hidden">
  <h3 id="inputTitle"></h3>
  <textarea id="inputText"></textarea>
  <button onclick="save()">저장</button>
</div>

<script>
let currentTab = "주간";

function init() {
  let savedPw = localStorage.getItem("pw");
  if (savedPw) {
    document.getElementById("lockTitle").innerText = "비밀번호 입력";
  }
}
init();

function handlePw() {
  let savedPw = localStorage.getItem("pw");
  let input = document.getElementById("pw").value;

  if (!savedPw) {
    localStorage.setItem("pw", input);
    startApp();
  } else {
    if (input === savedPw) {
      startApp();
    } else {
      alert("비밀번호 틀림");
    }
  }
}

function startApp() {
  document.getElementById("lock").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  render();
}

function changeTab(tab) {
  currentTab = tab;
  document.getElementById("tabTitle").innerText = tab;
  render();
}

function openInput() {
  document.getElementById("inputBox").classList.remove("hidden");
  document.getElementById("inputTitle").innerText = currentTab + " 계획 입력";
}

function save() {
  let text = document.getElementById("inputText").value;
  let data = JSON.parse(localStorage.getItem(currentTab) || "[]");
  data.push(text);
  localStorage.setItem(currentTab, JSON.stringify(data));
  document.getElementById("inputBox").classList.add("hidden");
  render();
}

function render() {
  let list = document.getElementById("list");
  list.innerHTML = "";
  let data = JSON.parse(localStorage.getItem(currentTab) || "[]");

  data.forEach(item => {
    let li = document.createElement("li");
    li.innerText = item;
    list.appendChild(li);
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
